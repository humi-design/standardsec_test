<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Support | Standard Securities</title>
    <link rel="stylesheet" href="css/premium-design.css">
    <link rel="stylesheet" href="css/uikit-compat.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-secondary);
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 600px;
            background: var(--bg-primary);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-2xl);
            overflow: hidden;
        }
        .chat-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
    <!-- Google Translate Widget -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'en,hi',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body>
    <a href="#chat" class="skip-link">Skip to chat</a>

    <main id="chat" class="chat-container">
        <iframe 
            src="https://webchat.botframework.com/embed/standardsec-bot-final?s=SvJm2QLqSrs.PoRNb8Ts5amROUJEzeJyoYqaJIohHSf13mSMppg86As" 
            title="Chat with Standard Securities Bot" 
            loading="lazy">
        </iframe>
    </main>

</body>
</html>
