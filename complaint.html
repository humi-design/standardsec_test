    function setLanguage(lang) {
        document.documentElement.lang = lang;
        const langEn = document.getElementById('lang-en');
        const langHi = document.getElementById('lang-hi');
        if (langEn) langEn.setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
        if (langHi) langHi.setAttribute('aria-pressed', lang === 'hi' ? 'true' : 'false');
        if (langEn) langEn.classList.toggle('active', lang === 'en');
        if (langHi) langHi.classList.toggle('active', lang === 'hi');
        localStorage.setItem('preferredLang', lang);
        if (lang === 'hi') {
            translatePageToHindi();
        } else {
            location.reload();
        }
    }
    
    function translatePageToHindi() {
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
            acceptNode: function(node) {
                const parent = node.parentElement;
                if (!parent) return NodeFilter.FILTER_REJECT;
                const tagName = parent.tagName.toLowerCase();
                if (['script', 'style', 'noscript', 'textarea', 'input'].includes(tagName)) {
                    return NodeFilter.FILTER_REJECT;
                }
                if (parent.hasAttribute('data-translated') || parent.closest('.lang-toggle')) {
                    return NodeFilter.FILTER_REJECT;
                }
                return NodeFilter.FILTER_ACCEPT;
            }
        });
        const textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);
        textNodes.forEach(node => {
            const text = node.textContent.trim();
            if (text && translations['hi'][text]) {
                node.textContent = translations['hi'][text];
                node.parentElement.setAttribute('data-translated', 'true');
            }
        });
    }
    
    // Restore dark mode preference
            const savedDarkMode = localStorage.getItem('darkMode');
            if (savedDarkMode === 'true') {
                document.body.classList.add('dark-mode');
            }
            
            // Restore font size preference
            const savedFontSize = localStorage.getItem('fontSize');
            if (savedFontSize) {
                document.documentElement.style.fontSize = savedFontSize + 'px';
            }
            document.addEventListener('DOMContentLoaded', function() {
        if (localStorage.getItem('preferredLang') === 'hi') setLanguage('hi');
    });
    
    // Mobile Navigation Fix
// Restore dark mode preference
            const savedDarkMode = localStorage.getItem('darkMode');
            if (savedDarkMode === 'true') {
                document.body.classList.add('dark-mode');
            }
            
            // Restore font size preference
            const savedFontSize = localStorage.getItem('fontSize');
            if (savedFontSize) {
                document.documentElement.style.fontSize = savedFontSize + 'px';
            }
            document.addEventListener('DOMContentLoaded', function() {
    var menuToggle = document.getElementById('mobile-menu-toggle');
    var mobileNav = document.getElementById('mobile-nav-modal');
    var closeBtn = mobileNav ? mobileNav.querySelector('.uk-modal-close-full') : null;
    
    if (menuToggle && mobileNav) {
        function toggleMobileMenu() {
            var isHidden = mobileNav.getAttribute('hidden') !== null;
            if (isHidden) {
                mobileNav.removeAttribute('hidden');
                menuToggle.setAttribute('aria-expanded', 'true');
                menuToggle.setAttribute('aria-label', 'Close mobile navigation menu');
                document.body.style.overflow = 'hidden';
                if (closeBtn) closeBtn.focus();
            } else {
                mobileNav.setAttribute('hidden', '');
                menuToggle.setAttribute('aria-expanded', 'false');
                menuToggle.setAttribute('aria-label', 'Open mobile navigation menu');
                document.body.style.overflow = '';
            }
        }
        menuToggle.addEventListener('click', toggleMobileMenu);
        if (closeBtn) closeBtn.addEventListener('click', toggleMobileMenu);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !mobileNav.hasAttribute('hidden')) {
                toggleMobileMenu();
                menuToggle.focus();
            }
        });
        var navLinks = mobileNav.querySelectorAll('a');
        navLinks.forEach(function(link) {
            link.setAttribute('tabindex', '0');
        });
    }
});
